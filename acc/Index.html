<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#192c40;--teal:#196d62;--line:#dfe6eb}*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font:14px system-ui,Arial}header{background:var(--ink);color:white;padding:18px}header b{font-size:21px}header small{display:block;opacity:.7}main{max-width:1050px;margin:auto;padding:14px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:16px}button{cursor:pointer}nav button,.secondary{background:white;color:var(--ink);border:1px solid var(--line);padding:11px;border-radius:9px;white-space:nowrap}nav button.active{background:var(--ink);color:white}.panel,.tile{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}h2{margin:0 0 15px}.grid,.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tiles{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:12px;font-weight:650;color:#526273;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5dc;border-radius:8px;font:inherit}textarea{min-height:75px}.wide{grid-column:1/-1}.primary{background:var(--teal);color:white;border:0;border-radius:8px;padding:13px 22px;font-weight:700}.primary:disabled{opacity:.5}.tile span{display:block;color:#677888}.tile strong{display:block;font-size:21px;margin-top:7px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px}th{background:#f3f6f8}.scroll{overflow:auto}.message{padding:12px;font-weight:650}.ok{color:#18754e}.bad{color:#b22d36}.summary{background:#edf6f2;border-radius:8px;padding:14px;margin:14px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.tile strong{font-size:17px}}
</style></head><body><header><b>ACC Pearl Ledger</b><small>Purchases · Sales · Accounts · Stock</small></header><main><nav id="nav"></nav><div id="view">Loading...</div><div id="msg" class="message"></div></main>
<script>
const pages=['Dashboard','Purchase','Sale','Expense','Receivable','Payable','Inventory','Reports'];let db=null,page='Dashboard',pending=null;
const $=id=>document.getElementById(id),v=id=>$(id)?.value||'',n=id=>Number(v(id))||0,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c])),j=x=>'¥'+Math.round(x||0).toLocaleString();
function message(s,cls=''){$('msg').textContent=s;$('msg').className='message '+cls}
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||e)))[name](...args))}
async function reload(){try{message('Loading...');db=await rpc('accData');draw();message('')}catch(e){message(e.message,'bad')}}
function go(p){page=p;pending=null;draw()}
function draw(){$('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+p+'</button>').join('');if(!db)return;if(page==='Dashboard')dashboard();else if(page==='Inventory')inventory();else if(page==='Reports')reports();else form()}
function field(label,id,type='text',value='',extra=''){return '<div><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function dropdown(label,id,items){return '<div><label>'+label+'</label><select id="'+id+'">'+items.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>'}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function form(){let h='<section class="panel"><h2>'+page+'</h2><form id="entry"><div class="grid">'+field('Date','date','date',today(),'required')+dropdown('Currency','currency',['JPY','USD','EUR'])+field('FX to JPY','fx','number',1,'min="0.000001" step="any" required');
h+=field(page==='Purchase'||page==='Payable'?'Supplier':page==='Sale'||page==='Receivable'?'Customer':'Payee','party','text','','list="partyList"');
const parties=page==='Purchase'||page==='Payable'?db.suppliers.map(x=>x.Supplier):db.customers.map(x=>x.Customer);
h+='<datalist id="partyList">'+parties.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>';
if(page==='Purchase'){h+=field('Lot number','lot','text','','required')+field('Serial','serial')+dropdown('Pearl type','pearlType',['Akoya','South Sea','Tahitian','Freshwater','Keshi'])+field('Size','size')+field('Grade','grade')+field('Color','color')+field('Shape','shape')+dropdown('Drilling','drilling',['None','Half Drilled','Full Drilled'])+dropdown('Unit','unit',['PCS','MOM','STS','PAIR','GRAM'])}
if(page==='Sale'){h+='<div class="wide"><label>Search lot / serial</label><input id="search" placeholder="Search purchased stock" oninput="lots()"></div><div class="wide"><label>Available lots</label><select id="purchaseId" onchange="calc()"></select></div>'}
if(['Purchase','Sale'].includes(page))h+=field('Quantity','qty','number','','min="0.000001" step="any" required')+field(page==='Sale'?'Selling price':'Unit cost','rate','number','','min="0" step="any" required')+field(page==='Sale'?'Amount received':'Amount paid','paid','number',0,'min="0" step="any"');
if(page==='Expense'){h+=dropdown('Expense category','category',[...db.categories,'+ Custom'])+'<div id="customWrap" style="display:none">'+field('Custom category','custom')+'</div>'+field('Amount','amount','number','','min="0.000001" step="any" required')}
if(['Receivable','Payable'].includes(page))h+=field('Opening balance','amount','number','','min="0.000001" step="any" required')+field('Already paid / received','paid','number',0,'min="0" step="any"')+field('Due date','dueDate','date');
h+='<div class="wide"><label>Notes</label><textarea id="notes"></textarea></div></div>';
if(['Purchase','Sale'].includes(page))h+='<div class="summary" id="calc"></div>';
h+='<p><button class="primary" id="save" type="submit">Save '+page+'</button></p></form></section>';
$('view').innerHTML=h;$('entry').onsubmit=save;
if(page==='Sale')lots();if(page==='Expense')$('category').onchange=()=>{$('customWrap').style.display=v('category')==='+ Custom'?'block':'none'};
['qty','rate','paid','fx'].forEach(x=>{if($(x))$(x).oninput=calc});calc()}
function lots(){const q=v('search').toLowerCase();const items=db.inventory.filter(x=>x.remaining>0&&[x.Lot,x.Serial,x['Pearl Type']].join(' ').toLowerCase().includes(q));$('purchaseId').innerHTML=items.map(x=>'<option value="'+esc(x.ID)+'">'+esc(x.Lot)+' / '+esc(x.Serial)+' — '+x.remaining+' '+esc(x.Unit)+'</option>').join('');calc()}
function calc(){if(!$('calc'))return;const total=n('qty')*n('rate');let h='Total: <b>'+v('currency')+' '+total.toLocaleString()+'</b> · Outstanding: '+Math.max(0,total-n('paid')).toLocaleString();if(page==='Sale'){const x=db.inventory.find(y=>String(y.ID)===v('purchaseId'));if(x)h+='<p>Gross profit: <b>'+j(total*n('fx')-n('qty')*Number(x['Unit Cost'])*Number(x['FX to JPY']||1))+'</b></p>'}$('calc').innerHTML=h}
async function save(e){e.preventDefault();const btn=$('save');btn.disabled=true;if(!pending)pending='acc'+Date.now().toString(36)+Math.random().toString(36).slice(2);const p={requestId:pending,date:v('date'),currency:v('currency'),fx:n('fx'),party:v('party'),lot:v('lot'),serial:v('serial'),pearlType:v('pearlType'),size:v('size'),grade:v('grade'),color:v('color'),shape:v('shape'),drilling:v('drilling'),unit:v('unit'),purchaseId:v('purchaseId'),qty:n('qty'),rate:n('rate'),paid:n('paid'),amount:n('amount'),category:v('category')==='+ Custom'?v('custom'):v('category'),dueDate:v('dueDate'),notes:v('notes')};try{message('Saving...');const result=await rpc('accSave',page,p);if(!result.ok)throw Error('Not saved');pending=null;await reload();message('✓ Saved and verified: '+result.id,'ok')}catch(err){message(err.message,'bad');btn.disabled=false}}
function dashboard(){const m=db.summary;const items=[['Sales',m.revenue],['Gross profit',m.gross],['Net profit',m.net],['Stock value',m.stock],['Receivables',m.receivables],['Payables',m.payables]];$('view').innerHTML='<div class="tiles">'+items.map(x=>'<div class="tile"><span>'+x[0]+'</span><strong>'+j(x[1])+'</strong></div>').join('')+'</div><section class="panel"><h2>Quick entry</h2>'+['Purchase','Sale','Expense'].map(x=>'<button class="secondary" onclick="go(\''+x+'\')">'+x+'</button> ').join('')+'</section>'}
function inventory(){$('view').innerHTML='<section class="panel"><h2>Inventory</h2><input id="filter" placeholder="Search lot, serial, type" oninput="stockTable()"><div id="stock"></div></section>';stockTable()}
function stockTable(){const q=v('filter').toLowerCase();const rows=db.inventory.filter(x=>[x.Lot,x.Serial,x['Pearl Type']].join(' ').toLowerCase().includes(q));$('stock').innerHTML='<div class="scroll"><table><tr><th>Lot</th><th>Serial</th><th>Type</th><th>Purchased</th><th>Sold</th><th>Remaining</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.Lot)+'</td><td>'+esc(x.Serial)+'</td><td>'+esc(x['Pearl Type'])+'</td><td>'+x.Quantity+'</td><td>'+x.sold+'</td><td>'+x.remaining+' '+esc(x.Unit)+'</td></tr>').join('')+'</table></div>'}
function reports(){const m=db.summary;$('view').innerHTML='<section class="panel"><h2>Profit & Loss (JPY)</h2><div class="scroll"><table>'+[['Revenue',m.revenue],['COGS',-m.cogs],['Gross profit',m.gross],['Expenses',-m.expenses],['Net profit',m.net]].map(x=>'<tr><td>'+x[0]+'</td><td>'+j(x[1])+'</td></tr>').join('')+'</table></div></section>'+['Receivables','Payables'].map(type=>'<section class="panel"><h2>'+type+'</h2><div class="scroll"><table><tr><th>Party</th><th>Balance</th><th>Action</th></tr>'+db[type.toLowerCase()].filter(x=>Number(x.Outstanding)>0).map(x=>'<tr><td>'+esc(x[type==='Receivables'?'Customer':'Supplier'])+'</td><td>'+esc(x.Currency)+' '+x.Outstanding+'</td><td><button class="secondary" onclick="pay(\''+type+'\',\''+esc(x.ID)+'\','+Number(x.Outstanding)+')">Payment</button></td></tr>').join('')+'</table></div></section>').join('')}
async function pay(type,id,max){const raw=prompt('Payment amount (max '+max+')');if(raw===null)return;const amt=Number(raw);if(!Number.isFinite(amt)||amt<=0||amt>max){message('Invalid payment','bad');return}try{await rpc('accPayment',type,id,amt);await reload();message('✓ Payment recorded','ok')}catch(e){message(e.message,'bad')}}
reload();
</script></body></html>
